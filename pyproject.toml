[project]
name = "sumo-banzuke"
version = "0.1.0"
description = "Predict the next makuuchi banzuke from basho results"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
